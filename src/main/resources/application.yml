spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

audit:
  capture-client-ip: ${AUDIT_CAPTURE_CLIENT_IP:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:8080}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    real-name: ${BOOTSTRAP_ADMIN_REAL_NAME:System Administrationmember}

springfox:
  documentation:
    enabled: ${API_DOCS_ENABLED:false}
