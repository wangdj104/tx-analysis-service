spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

audit:
  capture-client-ip: ${AUDIT_CAPTURE_CLIENT_IP:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:8080}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    real-name: ${BOOTSTRAP_ADMIN_REAL_NAME:System Administrationmember}

springfox:
  documentation:
    enabled: ${API_DOCS_ENABLED:false}

care-plan:
  enabled: ${CARE_PLAN_ENABLED:false}

alert-workflow:
  enabled: ${ALERT_WORKFLOW_ENABLED:false}

# 四个独立开关默认关闭。空白排程时区不被猜测或替换为服务器时区。
medication-execution:
  enabled: ${MEDICATION_EXECUTION_ENABLED:false}
  schedule-zone: ${MEDICATION_EXECUTION_SCHEDULE_ZONE:}
stock-workflow:
  enabled: ${STOCK_WORKFLOW_ENABLED:false}
family-assistance:
  enabled: ${FAMILY_ASSISTANCE_ENABLED:false}
emergency-assistance:
  enabled: ${EMERGENCY_ASSISTANCE_ENABLED:false}

# 就诊问题跟踪独立默认关闭；先核验结构与实际连接，再由使用者明确启用。
visit-question:
  enabled: ${VISIT_QUESTION_ENABLED:false}

# 病历更正默认关闭；安装并核验独立 SQL 后才可明确启用。
common-care-goals:
  enabled: ${COMMON_CARE_GOALS_ENABLED:false}

medical-record-correction:
  enabled: ${MEDICAL_RECORD_CORRECTION_ENABLED:false}

visit-followup:
  enabled: ${VISIT_FOLLOWUP_ENABLED:false}
