# 本仓库 MySQL 8.0 配置只用于演示新库初始化，不等于用户实际 MySQL 5.7.18 的升级路径。
# 实际旧库须先核验备份，按 01 只读预检 → 02 适用增量升级 → 03 只读后检；未知或部分结构必须停止。
# A/B 业务开关默认 false，仅透传环境变量；由使用者完成上述检查后明确激活，不能靠启动容器自动开启。
# 用药排程时区默认留空，必须由使用者明确提供有效时区，不从数据库、主机或浏览器猜测。
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-family_health}
      MYSQL_USER: ${MYSQL_USER:-family_health}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Copy .env.example to .env and set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 先初始化完整系统结构，再加载可选的本地演示记录。
      - ./src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./demo/sql/demo-data.sql:/docker-entrypoint-initdb.d/02-demo-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-family_health}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${MYSQL_USER:-family_health}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CARE_PLAN_ENABLED: ${CARE_PLAN_ENABLED:-false}
      ALERT_WORKFLOW_ENABLED: ${ALERT_WORKFLOW_ENABLED:-false}
      MEDICATION_EXECUTION_ENABLED: ${MEDICATION_EXECUTION_ENABLED:-false}
      MEDICATION_EXECUTION_SCHEDULE_ZONE: ${MEDICATION_EXECUTION_SCHEDULE_ZONE:-}
      STOCK_WORKFLOW_ENABLED: ${STOCK_WORKFLOW_ENABLED:-false}
      FAMILY_ASSISTANCE_ENABLED: ${FAMILY_ASSISTANCE_ENABLED:-false}
      EMERGENCY_ASSISTANCE_ENABLED: ${EMERGENCY_ASSISTANCE_ENABLED:-false}
      VISIT_QUESTION_ENABLED: ${VISIT_QUESTION_ENABLED:-false}
      VISIT_FOLLOWUP_ENABLED: ${VISIT_FOLLOWUP_ENABLED:-false}
      COMMON_CARE_GOALS_ENABLED: ${COMMON_CARE_GOALS_ENABLED:-false}
      MEDICAL_RECORD_CORRECTION_ENABLED: ${MEDICAL_RECORD_CORRECTION_ENABLED:-false}
      MEDICAL_REVIEW_API_ENABLED: ${MEDICAL_REVIEW_API_ENABLED:-false}
      MEDICAL_REVIEW_ENABLED: ${MEDICAL_REVIEW_ENABLED:-false}
      REPORT_PDF_FONT_PATH: ${REPORT_PDF_FONT_PATH:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      AUDIT_CAPTURE_CLIENT_IP: ${AUDIT_CAPTURE_CLIENT_IP:-false}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DEEPSEEK_API_MODEL: ${DEEPSEEK_API_MODEL:-deepseek-v3}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_BASE_URL: ${OCR_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OCR_MODEL: ${OCR_MODEL:-qwen-vl-max}
      LANGFLOW_ENABLED: ${LANGFLOW_ENABLED:-false}
      LANGFLOW_BASE_URL: ${LANGFLOW_BASE_URL:-http://host.docker.internal:7860/api}
      LANGFLOW_API_KEY: ${LANGFLOW_API_KEY:-}
      LANGFLOW_DEFAULT_FLOW_ID: ${LANGFLOW_DEFAULT_FLOW_ID:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mysql-data:
