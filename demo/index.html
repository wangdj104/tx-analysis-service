<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="通过安全私密的交互演示，体验家庭照护、健康趋势、用药管理和健康档案功能。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>澄明健康 · 交互演示</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="model.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#content">跳到主要内容</a>
  <aside class="sidebar" aria-label="功能导航">
    <a class="brand" href="#care"><img src="assets/logo.svg" width="38" height="38" alt=""><span><strong>澄明健康</strong><small>用心记录，从容生活</small></span></a>
    <span class="nav-caption">我的健康工作台</span>
    <nav>
      <a href="#care" data-page="care"><span aria-hidden="true">⌂</span>家庭照护</a>
      <a href="#overview" data-page="overview"><span aria-hidden="true">◷</span>健康概览</a>
      <a href="#medication" data-page="medication"><span aria-hidden="true">✚</span>用药管理</a>
      <a href="#records" data-page="records"><span aria-hidden="true">▤</span>医疗记录</a>
      <a href="#guide" data-page="guide"><span aria-hidden="true">?</span>演示指南</a>
    </nav>
    <div class="sidebar-bottom"><p>每天多一点贴心照护</p><div class="demo-account"><span class="avatar">演</span><div><b>演示访客</b><small>无需账号 · 虚构数据</small></div></div></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><span>我的健康工作台 <i>/</i> <b id="breadcrumb">家庭照护</b></span><label class="patient-select">家庭成员 <select id="patient"><option value="1">张爱华（演示）</option><option value="2">李建国（演示）</option></select></label></header>
    <div class="demo-banner"><span><b>交互演示</b> 所有数据均为虚构并仅保留在当前页面中；刷新后会重置，也不会发送任何通知。</span><button class="text-button" id="reset">重置演示</button></div>
    <main id="content" tabindex="-1"></main>
    <footer class="footer">澄明健康 · 长期家庭健康管理<span>本演示不提供医疗建议，请勿输入真实健康信息。</span></footer>
  </div>
  <dialog id="record-dialog" aria-labelledby="record-title"><form id="vital-form"><div class="dialog-header"><div><span class="eyebrow">快速录入</span><h2 id="record-title">记录血压</h2></div><button type="button" class="close-button" data-close aria-label="关闭血压记录对话框">×</button></div><p class="muted">本次录入仅影响当前演示，刷新页面后会清除。</p><div class="form-grid"><label>收缩压（mmHg）<input name="systolic" type="number" min="50" max="260" required value="126"></label><label>舒张压（mmHg）<input name="diastolic" type="number" min="30" max="160" required value="78"></label></div><p id="form-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="button secondary" data-close>取消</button><button class="button" type="submit">保存演示记录</button></div></form></dialog>
  <dialog id="detail-dialog" aria-labelledby="detail-title"><div class="dialog-header"><h2 id="detail-title">医疗记录</h2><button class="close-button" data-close aria-label="关闭记录对话框">×</button></div><div id="record-detail"></div><div class="dialog-actions"><button class="button secondary" data-close>关闭</button></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p>请启用 JavaScript 以使用此静态演示，无需服务器。</p></noscript>
</body>
</html>
