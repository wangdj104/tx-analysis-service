name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ['.', cn]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test backend
        run: mvn -B -DskipTests=false test
      - name: Package backend
        run: mvn -B -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [frontend, cn/frontend]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  static-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check demo/app.js
      - run: node --check cn/demo/app.js
      - run: |
          node --test demo/tests/*.test.mjs
          node --test cn/demo/tests/*.test.mjs

  care-plan-mysql:
    # Release gate: required native acceptance, never an H2/optional fallback.
    # Both languages and both fresh/upgrade passes use this exact checkout.
    name: Care plan MySQL 8.0 (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Two native passes plus 56 serial browser cases, real PDF inspection and artifact preparation.
    # Per-request, latch and individual browser-case deadlines remain unchanged.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: '.'
            language: en
          - directory: cn
            language: cn
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: 'localhost'
          # The official entrypoint otherwise defaults to a wildcard root host.
        ports:
          - '127.0.0.1:13306:3306'
        options: >-
          --health-cmd="mysqladmin ping --protocol=socket --user=root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/frontend/package-lock.json
      - name: Check MySQL test safety guards
        run: |
          bash -n scripts/verify-care-plan-mysql.sh
          node --test scripts/tests/care-plan-mysql-guards.test.mjs
          node --test scripts/tests/care-plan-browser-guards.test.mjs
          node --test scripts/tests/care-plan-browser-artifacts.test.mjs
          node --test scripts/tests/care-report-artifacts.test.mjs
      - name: Install pinned official browser test dependencies
        working-directory: ${{ matrix.directory }}/frontend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg fonts-wqy-microhei python3-fonttools poppler-utils
          npm ci
          npx --no-install playwright install --with-deps chromium
          command -v ffmpeg
          command -v ffprobe
          command -v pdfinfo
          command -v pdftotext
          command -v pdftoppm
      - name: Prepare complete official report font
        id: font_preparation
        run: |
          /usr/bin/python3 scripts/tests/care-report-font.test.py
          /usr/bin/python3 scripts/prepare-care-report-font.py
      - name: Check actual report download inspectors
        run: node --test scripts/tests/care-report-download-inspection.test.mjs
      - name: Verify two disposable native schema and restore passes
        env:
          CARE_PLAN_TEST_ONLY: 'true'
          CARE_PLAN_MYSQL_HOST: '127.0.0.1'
          CARE_PLAN_MYSQL_PORT: '13306'
          CARE_PLAN_MYSQL_PROJECT: ${{ matrix.directory }}
          CARE_PLAN_MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          set +x
          printf 'Native acceptance checkout: '
          git rev-parse HEAD
          for pass in 1 2; do
            prefix="care_plan_test_${{ matrix.language }}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${pass}"
            export CARE_PLAN_MYSQL_DATABASE="${prefix}_fresh"
            export CARE_PLAN_MYSQL_UPGRADE_DATABASE="${prefix}_upgrade"
            export CARE_PLAN_MYSQL_RESTORE_DATABASE="${prefix}_restore"
            export CARE_PLAN_MYSQL_USER="care_plan_test_${{ matrix.language }}_${pass}"
            password=$(openssl rand -hex 24)
            echo "::add-mask::$password"
            export CARE_PLAN_MYSQL_PASSWORD="$password"
            unset password
            if [[ "$pass" == 2 ]]; then
              login_password=$(openssl rand -hex 24)
              echo "::add-mask::$login_password"
              export CARE_PLAN_E2E_PASSWORD="$login_password"
              unset login_password
              export CARE_PLAN_BROWSER_REQUIRED=true
            fi
            bash scripts/verify-care-plan-mysql.sh
            unset CARE_PLAN_MYSQL_PASSWORD CARE_PLAN_E2E_PASSWORD CARE_PLAN_BROWSER_REQUIRED
          done
      - name: Generate fresh Task 5 renderer evidence
        id: renderer_evidence
        if: always() && steps.font_preparation.outcome == 'success'
        run: |
          set -euo pipefail
          # Only the four reviewed renderer specimen names; no target-directory sweep.
          rm -f -- '${{ matrix.directory }}/target/care-execution-report-qa/en/coverage-report.pdf' \
            '${{ matrix.directory }}/target/care-execution-report-qa/en/long-report.pdf' \
            '${{ matrix.directory }}/target/care-execution-report-qa/zh-CN/coverage-report.pdf' \
            '${{ matrix.directory }}/target/care-execution-report-qa/zh-CN/long-report.pdf'
          (cd '${{ matrix.directory }}' && mvn -B -Dtest=CareExecutionReportPdfTest -DskipTests=false test)
          node scripts/collect-care-report-renderer-evidence.mjs '${{ matrix.directory }}'
      - name: Stage bounded sanitized browser review artifacts
        id: browser_artifacts
        if: always()
        run: node scripts/package-care-plan-browser-artifacts.mjs '${{ matrix.directory }}' '${{ runner.temp }}/care-plan-browser-artifacts-${{ matrix.language }}'
      - name: Preserve browser main-personal
        if: always() && steps.browser_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: care-plan-browser-${{ matrix.language }}-${{ github.sha }}-main-personal
          path: ${{ runner.temp }}/care-plan-browser-artifacts-${{ matrix.language }}/main-personal/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
