name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ['.', cn]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test backend
        run: mvn -B -DskipTests=false test
      - name: Package backend
        run: mvn -B -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [frontend, cn/frontend]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  static-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check demo/app.js
      - run: node --check cn/demo/app.js
      - run: |
          node --test demo/tests/*.test.mjs
          node --test cn/demo/tests/*.test.mjs

  care-plan-mysql:
    # Release gate: required native acceptance, never an H2/optional fallback.
    # Both languages and both fresh/upgrade passes use this exact checkout.
    name: Care plan MySQL 8.0 (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: '.'
            language: en
          - directory: cn
            language: cn
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: 'localhost'
          # The official entrypoint otherwise defaults to a wildcard root host.
        ports:
          - '127.0.0.1:13306:3306'
        options: >-
          --health-cmd="mysqladmin ping --protocol=socket --user=root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/frontend/package-lock.json
      - name: Check MySQL test safety guards
        run: |
          bash -n scripts/verify-care-plan-mysql.sh
          node --test scripts/tests/care-plan-mysql-guards.test.mjs
          node --test scripts/tests/care-plan-browser-guards.test.mjs
          node --test scripts/tests/care-plan-browser-artifacts.test.mjs
      - name: Install pinned official browser test dependencies
        working-directory: ${{ matrix.directory }}/frontend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npm ci
          npx --no-install playwright install --with-deps chromium
          command -v ffmpeg
          command -v ffprobe
      - name: Verify two disposable native schema and restore passes
        env:
          CARE_PLAN_TEST_ONLY: 'true'
          CARE_PLAN_MYSQL_HOST: '127.0.0.1'
          CARE_PLAN_MYSQL_PORT: '13306'
          CARE_PLAN_MYSQL_PROJECT: ${{ matrix.directory }}
          CARE_PLAN_MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          set +x
          printf 'Native acceptance checkout: '
          git rev-parse HEAD
          for pass in 1 2; do
            prefix="care_plan_test_${{ matrix.language }}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${pass}"
            export CARE_PLAN_MYSQL_DATABASE="${prefix}_fresh"
            export CARE_PLAN_MYSQL_UPGRADE_DATABASE="${prefix}_upgrade"
            export CARE_PLAN_MYSQL_RESTORE_DATABASE="${prefix}_restore"
            export CARE_PLAN_MYSQL_USER="care_plan_test_${{ matrix.language }}_${pass}"
            password=$(openssl rand -hex 24)
            echo "::add-mask::$password"
            export CARE_PLAN_MYSQL_PASSWORD="$password"
            unset password
            if [[ "$pass" == 2 ]]; then
              login_password=$(openssl rand -hex 24)
              echo "::add-mask::$login_password"
              export CARE_PLAN_E2E_PASSWORD="$login_password"
              unset login_password
              export CARE_PLAN_BROWSER_REQUIRED=true
            fi
            bash scripts/verify-care-plan-mysql.sh
            unset CARE_PLAN_MYSQL_PASSWORD CARE_PLAN_E2E_PASSWORD CARE_PLAN_BROWSER_REQUIRED
          done
      - name: Stage bounded sanitized browser review artifacts
        id: browser_artifacts
        if: always()
        run: node scripts/package-care-plan-browser-artifacts.mjs '${{ matrix.directory }}' '${{ runner.temp }}/care-plan-browser-artifacts-${{ matrix.language }}'
      - name: Preserve browser main-personal
        if: always() && steps.browser_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: care-plan-browser-${{ matrix.language }}-${{ github.sha }}-main-personal
          path: ${{ runner.temp }}/care-plan-browser-artifacts-${{ matrix.language }}/main-personal/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser main-family
        if: always() && steps.browser_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: care-plan-browser-${{ matrix.language }}-${{ github.sha }}-main-family
          path: ${{ runner.temp }}/care-plan-browser-artifacts-${{ matrix.language }}/main-family/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser main-doctor
        if: always() && steps.browser_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: care-plan-browser-${{ matrix.language }}-${{ github.sha }}-main-doctor
          path: ${{ runner.temp }}/care-plan-browser-artifacts-${{ matrix.language }}/main-doctor/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser main-nurse
        if: always() && steps.browser_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: care-plan-browser-${{ matrix.language }}-${{ github.sha }}-main-nurse
          path: ${{ runner.temp }}/care-plan-browser-artifacts-${{ matrix.language }}/main-nurse/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser main-admin
        if: always() && steps.browser_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: care-plan-browser-${{ matrix.language }}-${{ github.sha }}-main-admin
          path: ${{ runner.temp }}/care-plan-browser-artifacts-${{ matrix.language }}/main-admin/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser main-outsider
        if: always() && steps.browser_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: care-plan-browser-${{ matrix.language }}-${{ github.sha }}-main-outsider
          path: ${{ runner.temp }}/care-plan-browser-artifacts-${{ matrix.language }}/main-outsider/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser screenshots-1
        if: always() && steps.browser_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: care-plan-browser-${{ matrix.language }}-${{ github.sha }}-screenshots-1
          path: ${{ runner.temp }}/care-plan-browser-artifacts-${{ matrix.language }}/screenshots-1/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser screenshots-2
        if: always() && steps.browser_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: care-plan-browser-${{ matrix.language }}-${{ github.sha }}-screenshots-2
          path: ${{ runner.temp }}/care-plan-browser-artifacts-${{ matrix.language }}/screenshots-2/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser screenshots-3
        if: always() && steps.browser_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: care-plan-browser-${{ matrix.language }}-${{ github.sha }}-screenshots-3
          path: ${{ runner.temp }}/care-plan-browser-artifacts-${{ matrix.language }}/screenshots-3/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser screenshots-4
        if: always() && steps.browser_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: care-plan-browser-${{ matrix.language }}-${{ github.sha }}-screenshots-4
          path: ${{ runner.temp }}/care-plan-browser-artifacts-${{ matrix.language }}/screenshots-4/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser remainder
        if: always() && steps.browser_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: care-plan-browser-${{ matrix.language }}-${{ github.sha }}-remainder
          path: ${{ runner.temp }}/care-plan-browser-artifacts-${{ matrix.language }}/remainder/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      # No database dump, credential file, trace/HAR or raw request/session data
      # is uploaded. Only actual synthetic visible screenshots/videos and concise evidence.
