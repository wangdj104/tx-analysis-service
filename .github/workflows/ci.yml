        if: always() && steps.report_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: care-report-${{ matrix.language }}-${{ github.sha }}-report-16
          path: ${{ runner.temp }}/care-report-artifacts-${{ matrix.language }}/report-16/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve bounded complete font provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: care-report-${{ matrix.language }}-${{ github.sha }}-font-provenance
          path: |
            ${{ runner.temp }}/care-report-font/font-preparation.json
            ${{ runner.temp }}/care-report-font/WQY-COPYRIGHT.txt
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      # No database dump, credential file, trace/HAR or raw request/session data
      # is uploaded. Only actual synthetic visible screenshots/videos and concise evidence.
