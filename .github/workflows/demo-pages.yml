name: Publish static demo

on:
  push:
    branches: [main, master]
    paths:
      - 'demo/**'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check demo behavior
        run: node --test demo/tests/*.test.mjs
      - uses: actions/configure-pages@v6
      - name: Prepare public files only
        run: |
          mkdir -p _site/assets
          cp demo/index.html demo/style.css demo/model.js demo/app.js _site/
          cp demo/assets/* _site/assets/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show demo link
        env:
          DEMO_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '### static Demo already release\n\n[openin linedemo](%s)\n\nREADME link: `[in lineexperience](%s)`\n' "$DEMO_URL" "$DEMO_URL" >> "$GITHUB_STEP_SUMMARY"
